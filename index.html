
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XRT'FFH4X MENU</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #05070c;
  font-family: Arial, sans-serif;
  color: white;
  overflow: hidden;
}

.menu {
  width: 90%;
  max-width: 390px;
  padding: 28px 22px;
  text-align: center;
  border: 2px solid #22c55e;
  border-radius: 25px;
  background: linear-gradient(145deg,#101722,#080a12);
  box-shadow: 0 0 20px #22c55e66,
              0 0 45px #9333ea44;
  animation: glow 4s infinite alternate;
}

@keyframes glow {
  0% { border-color: #22c55e; }
  25% { border-color: #ef4444; }
  50% { border-color: #a855f7; }
  75% { border-color: #facc15; }
  100% { border-color: #c0c0c0; }
}

.logo {
  font-size: 29px;
  font-weight: 900;
  letter-spacing: 2px;
  animation: colors 4s infinite;
}

@keyframes colors {
  0% { color: #22c55e; }
  25% { color: #ef4444; }
  50% { color: #a855f7; }
  75% { color: #facc15; }
  100% { color: #c0c0c0; }
}

.subtitle {
  color: #aaa;
  font-size: 12px;
  letter-spacing: 4px;
  margin-top: 8px;
}

.line {
  height: 2px;
  margin: 23px 0;
  background: linear-gradient(
    90deg,#22c55e,#ef4444,#a855f7,
    #facc15,#c0c0c0
  );
}

.youtube {
  padding: 16px;
  border-radius: 13px;
  background: #171d29;
  border: 1px solid #ef4444;
  color: #ef4444;
  font-size: 19px;
  font-weight: bold;
  box-shadow: 0 0 15px #ef444455;
}

.status {
  color: #aaa;
  font-size: 12px;
  margin-top: 23px;
}

.counter {
  font-size: 24px;
  font-weight: 900;
  margin: 7px 0;
  color: #22c55e;
  text-shadow: 0 0 20px currentColor;
  animation: pulse 1s infinite;
}

@keyframes pulse {
  50% { transform: scale(1.13); }
}

.progress {
  height: 7px;
  background: #222;
  border-radius: 20px;
  overflow: hidden;
  margin-top: 20px;
}

.bar {
  height: 100%;
  width: 100%;
  background: linear-gradient(
    90deg,#22c55e,#ef4444,#a855f7,
    #facc15,#c0c0c0
  );
  transition: width 1s linear;
}

.footer {
  margin-top: 24px;
  color: #888;
  font-size: 11px;
  letter-spacing: 2px;
}
</style>
</head>

<body>

<div class="menu">

  <div class="logo">XRT'FFH4X</div>
  <div class="subtitle">VIP MENU XRT ™</div>

  <div class="line">...........</div>

  <div class="youtube">
    XRT FFH4X'21H
  </div>

  <div class="status" id="status">
    ĐANG CHUẨN BỊ CHUYỂN HƯỚNG
  </div>

  <div class="counter" id="counter">999999999999999999999999</div>

  <div class="status">ĐÊM NGƯƠC..</div>

  <div class="progress">
    <div class="bar" id="bar">77777777777777777777777777777⁷777777777777777777777</div>
  </div>

  <div class="footer">
    XRT'FFH4X ° XRT MENU TẢI
  </div>

</div>

<script>
// THAY LINK YOUTUBE TẠI ĐÂY
const TARGET_URL = "https://shoplinks.to/8111305bjlNGx";

let count = 4;

const counter = document.getElementById("counter");
const status = document.getElementById("status");
const bar = document.getElementById("bar");

const timer = setInterval(() => {
  count--;

  counter.textContent = count;
  bar.style.width = (count / 4 * 100) + "%";

  if (count === 0) {
    clearInterval(timer);
    status.textContent = "ĐANG CHUYỂN ĐẾN LINK CHÍNH THỨC...";
    counter.textContent = "0";

    setTimeout(() => {
      window.location.replace(TARGET_URL);
    }, 500);
  }
}, 1000);
</script>

</body>
</html>
